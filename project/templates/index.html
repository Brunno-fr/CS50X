<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DYSONOS — Self-Expanding Network</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

    <!-- ========================================================== -->
    <!-- 3D CANVAS (Three.js) – hero background                     -->
    <!-- ========================================================== -->
    <canvas id="bg-canvas"></canvas>

    <!-- ========================================================== -->
    <!-- HERO SECTION (3D)                                          -->
    <!-- ========================================================== -->
    <section class="hero">
        <div class="hero-content">
            <p class="eyebrow">AUTONOMOUS INFRASTRUCTURE</p>
            <h1 class="hero-title">DYSONOS</h1>
            <p class="hero-subtitle">The network that expands itself</p>
            <div class="scroll-indicator">↓ Scroll to explore</div>
        </div>
    </section>

    <!-- ========================================================== -->
    <!-- DASHBOARD                                                  -->
    <!-- ========================================================== -->
    <section id="dashboard">
        <div class="container">
            <h2>📊 Network Status</h2>
            <div class="metrics">
                <div class="metric"><span class="label">Nodes</span><span id="nodes" class="value">0</span></div>
                <div class="metric"><span class="label">Zones</span><span id="zones" class="value">0</span></div>
                <div class="metric"><span class="label">Capacity</span><span id="capacity" class="value">0</span> req/s</div>
                <div class="metric"><span class="label">Utilization</span><span id="utilization" class="value">0</span>%</div>
                <div class="metric"><span class="label">Expansions</span><span id="events" class="value">0</span></div>
            </div>
            <div id="statusMessage" class="message">🟢 Network healthy</div>
            <button id="increaseDemand" class="btn-primary">📈 INCREASE DEMAND</button>
            <button id="resetSimulation" class="btn-secondary">🔄 RESET SIMULATION</button>
        </div>
    </section>

    <!-- ========================================================== -->
    <!-- NETWORK VISUALIZATION (canvas)                             -->
    <!-- ========================================================== -->
    <section id="network-viz">
        <div class="container">
            <h2>🗺️ Network Topology</h2>
            <canvas id="networkCanvas"></canvas>
        </div>
    </section>

    <!-- ========================================================== -->
    <!-- FOOTER                                                     -->
    <!-- ========================================================== -->
    <footer>
        <p>Developed by <strong>Brunno Alr</strong> • Project for <strong>CS50</strong></p>
        <p style="font-size: 0.7rem; opacity: 0.6; margin-top: 5px;">AI use declared in the source code.</p>
    </footer>

    <!-- ========================================================== -->
    <!-- EXTERNAL LIBRARIES                                         -->
    <!-- ========================================================== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Main JavaScript -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
